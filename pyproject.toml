[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "live-media-scan-producer"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv>=1.1.1",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src/"]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_default_fixture_loop_scope = "function"